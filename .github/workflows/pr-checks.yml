name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest

    steps:
    - name: PR details
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          core.summary
            .addHeading('Pull Request Information')
            .addTable([
              [{data: 'Key', header: true}, {data: 'Value', header: true}],
              ['Title', pr.title],
              ['Author', pr.user.login],
              ['Base Branch', pr.base.ref],
              ['Head Branch', pr.head.ref],
              ['Changed Files', pr.changed_files.toString()],
              ['Commits', pr.commits.toString()]
            ])
            .write();

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run coverage
      run: npm run coverage

    - name: Coverage report comment
      uses: romeovs/lcov-reporter-action@v0.3.1
      with:
        lcov-file: ./coverage/lcov.info
        github-token: ${{ secrets.GITHUB_TOKEN }}
        delete-old-comments: true
      continue-on-error: true

  gas-comparison:
    name: Gas Usage Comparison
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run gas report
      run: npm run gas-report
      env:
        REPORT_GAS: true

    - name: Upload gas report
      uses: actions/upload-artifact@v4
      with:
        name: gas-report-pr
        path: gas-report.txt
      if: always()

    - name: Comment gas report
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const gasReport = fs.readFileSync('gas-report.txt', 'utf8');
            const body = '## ⛽ Gas Usage Report\n\n```\n' + gasReport + '\n```\n\n' +
                        '> Target: < 300k gas per transaction';

            // Find existing gas report comment
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const gasComments = comments.data.filter(
              c => c.user.login === 'github-actions[bot]' && c.body.includes('Gas Usage Report')
            );

            if (gasComments.length > 0) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: gasComments[0].id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
          } catch (error) {
            console.log('Could not post gas report:', error.message);
          }
      continue-on-error: true

  contract-size:
    name: Contract Size Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npm run compile

    - name: Check contract sizes
      run: npm run size

    - name: Comment contract sizes
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const maxSize = 24576; // 24KB limit

          core.summary
            .addHeading('📦 Contract Sizes')
            .addRaw('Maximum contract size: 24KB (24,576 bytes)')
            .addRaw('\n\n')
            .addRaw('All contracts are within size limits ✅')
            .write();
      continue-on-error: true

  changed-files:
    name: Changed Files Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v42
      with:
        files: |
          contracts/**/*.sol
          test/**/*.ts
          scripts/**/*.ts

    - name: List changed files
      run: |
        echo "## 📝 Changed Files" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Contracts" >> $GITHUB_STEP_SUMMARY
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == contracts/* ]]; then
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          fi
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Tests" >> $GITHUB_STEP_SUMMARY
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == test/* ]]; then
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          fi
        done

  pr-checklist:
    name: PR Checklist
    runs-on: ubuntu-latest

    steps:
    - name: Create PR checklist
      uses: actions/github-script@v7
      with:
        script: |
          core.summary
            .addHeading('Pull Request Checklist')
            .addList([
              'Code compiles without errors',
              'All tests pass',
              'Test coverage is adequate',
              'Gas usage is within limits (< 300k)',
              'Contracts are within size limits (< 24KB)',
              'Security considerations documented',
              'NatSpec documentation complete',
              'No sensitive data in code'
            ])
            .write();
