name: Security Checks

on:
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: |
        npm audit --audit-level=high --json > npm-audit.json || true
        cat npm-audit.json

    - name: Upload npm audit results
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-results
        path: npm-audit.json
      if: always()

  slither-analysis:
    name: Slither Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Slither
      run: |
        pip3 install slither-analyzer
        pip3 install solc-select
        solc-select install 0.8.20
        solc-select use 0.8.20

    - name: Run Slither
      run: |
        slither . \
          --json slither-output.json \
          --checklist \
          --markdown-root slither-report.md \
          --filter-paths "node_modules|test" \
          || true

    - name: Upload Slither results
      uses: actions/upload-artifact@v4
      with:
        name: slither-analysis
        path: |
          slither-output.json
          slither-report.md
      if: always()

  mythril-analysis:
    name: Mythril Analysis
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Mythril
      run: pip3 install mythril

    - name: Run Mythril on Vault
      run: |
        myth analyze contracts/core/Vault.sol \
          --solc-json mythril-config.json \
          --execution-timeout 300 \
          || true
      continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-audit, slither-analysis]
    if: always()

    steps:
    - name: Create summary
      run: |
        echo "## 🔒 Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Security checks completed. Review artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Checks performed:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ NPM Audit" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Slither Static Analysis" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Mythril Analysis" >> $GITHUB_STEP_SUMMARY
