name: Security Checks

# The same two checks run in ci.yml on every push and pull request. They are
# repeated on a schedule because advisories and detectors change without the
# code changing: this workflow re-checks main against today's databases.
on:
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Same gate and same reasoning as the audit step in ci.yml — runtime
    # dependencies only, failing on anything high or above.
    - name: npm audit (runtime dependencies)
      run: npm audit --omit=dev --audit-level=high

  slither-analysis:
    name: Slither Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npm run compile

    # Fails on medium and high impact findings; low and informational findings
    # are printed and do not block. Installed from pip at a pinned version
    # instead of through crytic/slither-action, whose Python 3.9 image can
    # only resolve a release that ignores the threshold. See the longer note
    # in ci.yml.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Slither
      run: pip install slither-analyzer==0.11.6

    - name: Slither
      run: slither . --hardhat-ignore-compile --config-file slither.config.json --fail-medium
