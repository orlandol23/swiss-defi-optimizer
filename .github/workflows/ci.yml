name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npm run compile

    - name: Run tests
      run: npm test
      env:
        REPORT_GAS: false

    # `contractSizer.strict` is true in hardhat.config.ts, so a contract over
    # the 24KB EIP-170 limit already fails the compile above. This step prints
    # the table and fails on the same condition — it is a check, not a report.
    - name: Check contract sizes
      run: npm run size

    # Coverage is not run here: it lives in pr-checks.yml, where the report is
    # posted on the pull request. Running it in this matrix would compile and
    # execute the suite a third and fourth time for the same numbers.

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.node-version }}
        path: |
          artifacts/
          typechain-types/
      if: always()

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # The tests are typed against TypeChain's generated bindings, and
    # typechain-types/ is gitignored — so it does not exist in a fresh
    # checkout. Without this step tsc sees getContractFactory() return an
    # untyped factory and every contract call is a TS2339 "does not exist on
    # type 'BaseContract'". Compiling first is what makes the typecheck
    # meaningful rather than merely green.
    - name: Compile contracts (generates TypeChain bindings)
      run: npx hardhat compile

    - name: Run TypeScript checks
      run: npx tsc --noEmit

  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npm run compile

    # Slither runs from a pinned pip install rather than through
    # crytic/slither-action. The action analyses inside a Python 3.9 image,
    # and slither-analyzer requires 3.10 or newer from 0.11.5 on, so pip
    # resolves down to 0.11.4 in there. That release ignores the medium
    # threshold from the config file and from the command line alike and
    # fails on any finding at all, which is what turned five informational
    # and low results into a red job while the gate that was meant to be
    # armed never was. Bump the pin deliberately, and re-check the threshold
    # still holds when you do.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Slither
      run: pip install slither-analyzer==0.11.6

    # Fails the job on medium and high impact findings; low and informational
    # findings are printed and do not block. The threshold is stated twice on
    # purpose: `--fail-medium` here, and `fail_on` in slither.config.json so a
    # local run without the flag gates the same way. The compile above is what
    # the analysis reads, hence hardhat-ignore-compile.
    - name: Slither
      run: slither . --hardhat-ignore-compile --config-file slither.config.json --fail-medium

    # Runtime dependencies only; dev tooling never reaches a deployment.
    #
    # The gate is `high`. It used to be `critical`, because the unused
    # @chainlink/contracts package dragged 6 high advisories in through its
    # transitive JavaScript tree. That package is gone — PriceConverter uses
    # the AggregatorV3Interface vendored in contracts/interfaces/ — and the
    # runtime tree is now clean, so this step can hold the line at `high`.
    - name: npm audit (runtime dependencies)
      run: npm audit --omit=dev --audit-level=high

  # A Dependency Review job used to sit here. The action answers
  # "Dependency review is not supported on this repository" unless the
  # Dependency graph is enabled under Settings, Code security, so the check
  # could only ever be red. Runtime advisories are already gated by the
  # npm audit step above, which needs no repository setting. Turn the
  # Dependency graph on and this job is worth adding back.

  gas-report:
    name: Gas Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate gas report
      run: npm run gas-report
      env:
        REPORT_GAS: true

    - name: Upload gas report
      uses: actions/upload-artifact@v4
      with:
        name: gas-report
        path: gas-report.txt
      if: always()

    # Informational: posting the comment needs a writable token, which pull
    # requests from forks do not get. The gas numbers themselves were produced
    # by the step above, which is not allowed to fail; only the delivery of the
    # comment is best-effort. The report is always in the artifact.
    - name: Comment PR with gas report
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          const gasReport = fs.readFileSync('gas-report.txt', 'utf8');
          const body = '## ⛽ Gas Report\n\n```\n' + gasReport + '\n```';

          const comments = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const previous = comments.data.find(
            c => c.user.login === 'github-actions[bot]' && c.body.includes('⛽ Gas Report')
          );

          if (previous !== undefined) {
            await github.rest.issues.updateComment({
              comment_id: previous.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
          }
