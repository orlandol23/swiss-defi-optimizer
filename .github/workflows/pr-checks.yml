name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Compile, tests, contract size, Slither, npm audit and the gas report all run
# in ci.yml, which also triggers on pull_request. This workflow holds the one
# check that is worth running only on a pull request: coverage, whose value is
# the report posted back on the PR.
# Least privilege by default. A job that needs to write (posting a PR comment,
# for example) declares its own `permissions:`, which replaces this one for
# that job rather than adding to it.
permissions:
  contents: read

jobs:
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run coverage
      run: npm run coverage

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
      if: always()

    # Informational: posting the comment needs a writable token, which pull
    # requests from forks do not get. The coverage run above is not allowed to
    # fail; only the delivery of the comment is best-effort, and the lcov data
    # is always in the artifact.
    - name: Coverage report comment
      uses: romeovs/lcov-reporter-action@v0.3.1
      continue-on-error: true
      with:
        lcov-file: ./coverage/lcov.info
        github-token: ${{ secrets.GITHUB_TOKEN }}
        delete-old-comments: true
