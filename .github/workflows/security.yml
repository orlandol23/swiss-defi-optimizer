name: Security Checks

# The same two checks run in ci.yml on every push and pull request. They are
# repeated on a schedule because advisories and detectors change without the
# code changing: this workflow re-checks main against today's databases.
on:
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Same gate and same reasoning as the audit step in ci.yml — runtime
    # dependencies only, failing on anything high or above.
    - name: npm audit (runtime dependencies)
      run: npm audit --omit=dev --audit-level=high

  slither-analysis:
    name: Slither Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npm run compile

    # Fails on medium and high impact findings; low and informational findings
    # are printed but do not block (see slither.config.json).
    - name: Slither
      uses: crytic/slither-action@v0.4.1
      with:
        target: .
        ignore-compile: true
        fail-on: medium
        slither-config: slither.config.json
